[project]
name = "plantravel"
version = "0.1.0"
description = "APlanejador de Viagens com LangGraph"
readme = "README.md"
authors = [
    { name = "Paulo Pitte", email = "6819211+paulopitte@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
]

[project.scripts]
plantravel = "plantravel:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
